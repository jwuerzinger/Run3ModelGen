prior: flat
num_models: 1000
isGMSB: False
parameters:
  tanb: [1, 70]
  M_1: [-5079, 5079]
  M_2: [-10000, 10000]
  M_3: [-35293, 35293]
  AT: [-10000, 10000]
  Ab: [-10000, 10000]
  Atau: [0,0]
  mHu2: [-30000, 1000]
  mHd2: [-1000, 30000]
  sgnMu: [-1, 1]
  meL: [0, 10000]
  mtauL: [0, 10000]
  meR: [0, 10000]
  mtauR: [0, 10000]
  mqL1: [0, 10000]
  mqL3: [0, 10000]
  muR: [0, 10000]
  mtR: [0, 10000]
  mdR: [0, 10000]
  mbR: [0, 10000]
steps:
  - name: prep_input
    output_dir: input
    prefix: IN
  - name: SPheno
    input_dir: input
    output_dir: SPheno
    log_dir: SPheno_log
    prefix: SP
  - name: softsusy
    input_dir: input
    output_dir: softsusy
    prefix: SS
  - name: micromegas
    input_dir: SPheno
    output_dir: micromegas
    prefix: MO
  - name: superiso
    input_dir: SPheno
    output_dir: superiso
    prefix: SI
  - name: gm2calc
    input_dir: SPheno
    output_dir: gm2calc
    prefix: GM2
  # - name: evade
  #   input_dir: SPheno
  #   output_dir: evade
  #   prefix: EV
